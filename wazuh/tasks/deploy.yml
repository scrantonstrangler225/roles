---
- name: Pull Wazuh manager image
  community.docker.docker_image:
    name: "{{ wazuh_manager_image }}"
    source: pull

- name: Pull Wazuh indexer image
  community.docker.docker_image:
    name: "{{ wazuh_indexer_image }}"
    source: pull

- name: Pull Wazuh dashboard image
  community.docker.docker_image:
    name: "{{ wazuh_dashboard_image }}"
    source: pull

- name: Start Wazuh indexer
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_base_dir }}"
    project_name: "{{ wazuh_project_name }}"
    services:
      - wazuh.indexer
    state: present
    recreate: auto


- name: Wait for Wazuh indexer container
  community.docker.docker_container_info:
    name: "{{ wazuh_indexer_container_name }}"
  register: wazuh_indexer_info
  retries: 30
  delay: 10
  until:
    - wazuh_indexer_info.container is defined
    - wazuh_indexer_info.container.State.Running | default(false)

- name: Initialize Wazuh Indexer security configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --user
      - root
      - -e
      - INSTALLATION_DIR=/usr/share/wazuh-indexer
      - -e
      - CONFIG_DIR=/usr/share/wazuh-indexer/config
      - -e
      - JAVA_HOME=/usr/share/wazuh-indexer/jdk
      - -e
      - OPENSEARCH_JAVA_HOME=/usr/share/wazuh-indexer/jdk
      - -e
      - PATH=/usr/share/wazuh-indexer/jdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - "{{ wazuh_indexer_container_name }}"
      - sh
      - -c
      - >
        yum install -y which &&
        /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh
        -cd /usr/share/wazuh-indexer/config/opensearch-security/
        -cacert /usr/share/wazuh-indexer/config/certs/root-ca.pem
        -cert /usr/share/wazuh-indexer/config/certs/admin.pem
        -key /usr/share/wazuh-indexer/config/certs/admin-key.pem
        -icl
        -nhnv
  register: wazuh_securityadmin
  changed_when: true


- name: Start Wazuh stack
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_base_dir }}"
    project_name: "{{ wazuh_project_name }}"
    state: "{{ wazuh_service_state }}"
    recreate: auto
