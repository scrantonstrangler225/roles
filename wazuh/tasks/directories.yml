---
- name: Create Wazuh base directory
  ansible.builtin.file:
    path: "{{ wazuh_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Wazuh configuration directory
  ansible.builtin.file:
    path: "{{ wazuh_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Wazuh certificate directory
  ansible.builtin.file:
    path: "{{ wazuh_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
