---
- name: Check Wazuh containers
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: wazuh_container_info
  loop:
    - "{{ wazuh_manager_container_name }}"
    - "{{ wazuh_indexer_container_name }}"
    - "{{ wazuh_dashboard_container_name }}"

- name: Display Wazuh container status
  ansible.builtin.debug:
    msg:
      - "Container: {{ item.item }}"
      - "Running: {{ item.container.State.Running | default(false) }}"
      - "Status: {{ item.container.State.Status | default('unknown') }}"
  loop: "{{ wazuh_container_info.results }}"
