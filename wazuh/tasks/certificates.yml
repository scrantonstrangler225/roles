---
- name: Deploy Wazuh certificate configuration
  ansible.builtin.template:
    src: certs.yml.j2
    dest: "{{ wazuh_config_dir }}/certs.yml"
    owner: root
    group: root
    mode: "0644"

- name: Check whether Wazuh certificates exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ wazuh_root_ca_cert }}"
    - "{{ wazuh_indexer_cert }}"
    - "{{ wazuh_indexer_key }}"
    - "{{ wazuh_manager_cert }}"
    - "{{ wazuh_manager_key }}"
    - "{{ wazuh_dashboard_cert }}"
    - "{{ wazuh_dashboard_key }}"
    - "{{ wazuh_certs_dir }}/admin.pem"
    - "{{ wazuh_certs_dir }}/admin-key.pem"
  register: wazuh_certificate_files

- name: Determine whether certificates need generation
  ansible.builtin.set_fact:
    wazuh_certificates_missing: >-
      {{
        wazuh_certificate_files.results
        | selectattr('stat.exists', 'equalto', false)
        | list
        | length > 0
      }}

- name: Deploy Wazuh certificate generator Compose file
  ansible.builtin.template:
    src: generate-indexer-certs.yml.j2
    dest: "{{ wazuh_cert_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - wazuh_generate_certs
    - wazuh_certificates_missing

- name: Generate Wazuh certificates
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ wazuh_cert_compose_file }}
      run
      --rm
      --remove-orphans
      generator
  args:
    chdir: "{{ wazuh_base_dir }}"
  when:
    - wazuh_generate_certs
    - wazuh_certificates_missing

