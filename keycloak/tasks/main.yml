---
- name: Create Keycloak data directory
  ansible.builtin.file:
    path: /opt/keycloak
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Keycloak themes directory
  ansible.builtin.file:
    path: /opt/keycloak/themes
    state: directory
    owner: root
    group: root
    mode: "0755"

