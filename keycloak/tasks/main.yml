- name: Ensure Keycloak container is running
  community.docker.docker_container:
    name: "{{ keycloak_container_name }}"
    image: "{{ keycloak_image }}"
    state: started
    restart_policy: unless-stopped

    command:
      - start

    networks: "{{ keycloak_networks }}"

    published_ports: "{{ keycloak_ports }}"

    volumes: "{{ keycloak_volumes }}"

    env: "{{ keycloak_env }}"

      #security_opts:
      #- no-new-privileges: true

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 ||
          exit 1;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s


- name: Wait for Keycloak container to become healthy
  community.docker.docker_container_info:
    name: "{{ keycloak_container_name }}"
  register: keycloak_container
  retries: 30
  delay: 5
  until:
    - keycloak_container.container.State.Health is defined
    - keycloak_container.container.State.Health.Status == "healthy"

