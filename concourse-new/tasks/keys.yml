
---
#########################################################################
# Create key directory
#########################################################################

- name: Create Concourse keys directory
  ansible.builtin.file:
    path: "{{ concourse_keys_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

#########################################################################
# Generate Web keys
#########################################################################

- name: Generate Concourse TSA host key
  ansible.builtin.command:
    cmd: >
      ssh-keygen -q
      -t rsa
      -b 4096
      -m PEM
      -N ""
      -f {{ concourse_keys_dir }}/tsa_host_key
    creates: "{{ concourse_keys_dir }}/tsa_host_key"

- name: Generate Concourse session signing key
  ansible.builtin.command:
    cmd: >
      ssh-keygen -q
      -t rsa
      -b 4096
      -m PEM
      -N ""
      -f {{ concourse_keys_dir }}/session_signing_key
    creates: "{{ concourse_keys_dir }}/session_signing_key"

#########################################################################
# Generate Linux worker key
#########################################################################

- name: Generate Linux worker key
  ansible.builtin.command:
    cmd: >
      ssh-keygen -q
      -t rsa
      -b 4096
      -m PEM
      -N ""
      -f {{ concourse_keys_dir }}/worker_key
    creates: "{{ concourse_keys_dir }}/worker_key"

#########################################################################
# Set key permissions
#########################################################################

- name: Set private key permissions
  ansible.builtin.file:
    path: "{{ concourse_keys_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - tsa_host_key
    - session_signing_key
    - worker_key

- name: Set public key permissions
  ansible.builtin.file:
    path: "{{ concourse_keys_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - tsa_host_key.pub
    - worker_key.pub

#########################################################################
# Read Linux worker public key
#########################################################################

- name: Read Linux worker public key
  ansible.builtin.slurp:
    src: "{{ concourse_keys_dir }}/worker_key.pub"
  register: concourse_linux_worker_public_key

#########################################################################
# Build authorized worker keys
#########################################################################

- name: Deploy authorized worker public keys
  ansible.builtin.copy:
    dest: "{{ concourse_keys_dir }}/authorized_worker_keys.pub"
    content: |
      {{ concourse_linux_worker_public_key.content | b64decode | trim }}
      {% for worker_key in concourse_additional_worker_public_keys %}
      {{ worker_key }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  register: concourse_authorized_keys_file

#########################################################################
# Check Web key volume contents
#########################################################################

- name: Check Web keys volume
  ansible.builtin.command:
    cmd: >
      docker run --rm
      -v {{ concourse_web_keys_volume }}:/keys:ro
      alpine
      sh -c "test -f /keys/session_signing_key &&
             test -f /keys/tsa_host_key &&
             test -f /keys/authorized_worker_keys.pub"
  register: concourse_web_keys_check
  changed_when: false
  failed_when: false

#########################################################################
# Copy Web keys
#########################################################################

- name: Copy Web keys into Docker volume
  ansible.builtin.command:
    cmd: >
      docker run --rm
      -v {{ concourse_web_keys_volume }}:/keys
      -v {{ concourse_keys_dir }}:/source:ro
      alpine
      sh -c "
        cp /source/session_signing_key /keys/  
        cp /source/tsa_host_key /keys/ 
        cp /source/authorized_worker_keys.pub /keys/ 

        chmod 600 /keys/session_signing_key 
        chmod 600 /keys/tsa_host_key 
        chmod 644 /keys/authorized_worker_keys.pub
      "
  when: >
    concourse_web_keys_check.rc != 0 or
    concourse_authorized_keys_file.changed
  changed_when: true

#########################################################################
# Check Linux worker key volume contents
#########################################################################

- name: Check Linux worker keys volume
  ansible.builtin.command:
    cmd: >
      docker run --rm
      -v {{ concourse_worker_keys_volume }}:/keys:ro
      alpine
      sh -c "test -f /keys/worker_key &&
             test -f /keys/tsa_host_key.pub"
  register: concourse_worker_keys_check
  changed_when: false
  failed_when: false

#########################################################################
# Copy Linux worker keys
#########################################################################

- name: Copy Linux worker keys into Docker volume
  ansible.builtin.command:
    cmd: >
      docker run --rm
      -v {{ concourse_worker_keys_volume }}:/keys
      -v {{ concourse_keys_dir }}:/source:ro
      alpine
      sh -c "cp /source/worker_key /source/tsa_host_key.pub /keys/ &&
             chmod 600 /keys/worker_key &&
             chmod 644 /keys/tsa_host_key.pub"
  when: concourse_worker_keys_check.rc != 0
  changed_when: true

