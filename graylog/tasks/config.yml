---
- name: Deploy Graylog configuration
  ansible.builtin.template:
    src: graylog.conf.j2
    dest: "{{ graylog_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Graylog

- name: Deploy Graylog Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ graylog_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Graylog
